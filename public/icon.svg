<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded square gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B54" />
      <stop offset="50%" stop-color="#F26440" />
      <stop offset="100%" stop-color="#D94825" />
    </linearGradient>

    <!-- Smoothie cup gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="15%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FAF0E6" />
      <stop offset="100%" stop-color="#EEDCC8" />
    </linearGradient>

    <!-- Smoothie liquid blend gradient (Tropical Sunset: Watermelon Red into Mango Gold) -->
    <linearGradient id="smoothieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="45%" stop-color="#F43F5E" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Cup highlight reflection -->
    <linearGradient id="cupHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Straw stripes -->
    <pattern id="strawPattern" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#EF4444" stroke-width="10" />
      <line x1="10" y1="0" x2="10" y2="20" stroke="#FFFFFF" stroke-width="10" />
    </pattern>

    <!-- Shadow drop filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>

    <filter id="cupShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#5C2410" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container (App Icon Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner ambient glow -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />

  <!-- Straw (behind dome/rim) -->
  <g filter="url(#shadow)">
    <!-- Slanted Straw body -->
    <path d="M 290 80 L 330 15 L 360 30 L 320 95 Z" fill="url(#strawPattern)" stroke="#B91C1C" stroke-width="2" />
    <!-- Straw lower section inside cup -->
    <path d="M 270 120 L 290 80 L 320 95 L 300 135 Z" fill="url(#strawPattern)" />
  </g>

  <!-- Cup Group with shadow -->
  <g filter="url(#cupShadow)">
    <!-- Clear/Frosty Cup Body -->
    <path d="M 148 180 L 176 430 Q 180 448 200 448 L 312 448 Q 332 448 336 430 L 364 180 Z" 
          fill="url(#cupGrad)" stroke="#4A2810" stroke-width="10" stroke-linejoin="round" />

    <!-- Smoothie Liquid Fill -->
    <path d="M 160 210 L 182 422 Q 185 436 202 436 L 310 436 Q 327 436 330 422 L 352 210 Q 306 226 256 220 Q 206 214 160 210 Z" 
          fill="url(#smoothieGrad)" />

    <!-- Glass Reflection Left -->
    <path d="M 170 216 L 190 416 Q 192 426 200 426 L 214 426 L 194 216 Z" 
          fill="url(#cupHighlight)" />

    <!-- Boba / Fruit pearls at the bottom -->
    <circle cx="216" cy="406" r="14" fill="#3D1A10" opacity="0.85" />
    <circle cx="256" cy="414" r="15" fill="#3D1A10" opacity="0.85" />
    <circle cx="296" cy="404" r="14" fill="#3D1A10" opacity="0.85" />
    <circle cx="236" cy="380" r="13" fill="#3D1A10" opacity="0.75" />
    <circle cx="276" cy="384" r="13" fill="#3D1A10" opacity="0.75" />

    <!-- Whipped Cream & Tropical Topping on top -->
    <path d="M 152 186 C 145 150 185 125 210 135 C 230 110 282 105 305 130 C 330 115 365 138 360 186 Z" 
          fill="#FFFBF2" stroke="#4A2810" stroke-width="8" stroke-linejoin="round" />

    <!-- Cup Rim Collar -->
    <rect x="136" y="174" width="240" height="22" rx="11" 
          fill="#FFFFFF" stroke="#4A2810" stroke-width="9" />

    <!-- Fresh Mint Leaf Garnish on Whip -->
    <path d="M 230 126 C 220 90 255 80 270 95 C 275 115 255 135 230 126 Z" 
          fill="#10B981" stroke="#065F46" stroke-width="4" />
    <path d="M 240 120 Q 255 105 265 98" stroke="#047857" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Watermelon Triangle Slice Wedge on Edge -->
    <g transform="translate(112, 105) rotate(-22)">
      <!-- Green Rind -->
      <path d="M 10 70 A 55 55 0 0 1 90 70 L 50 15 Z" fill="#10B981" stroke="#064E3B" stroke-width="6" stroke-linejoin="round" />
      <!-- White Sub-rind -->
      <path d="M 16 68 A 48 48 0 0 1 84 68 L 50 24 Z" fill="#ECFDF5" />
      <!-- Red Juicy Flesh -->
      <path d="M 22 65 A 42 42 0 0 1 78 65 L 50 30 Z" fill="#EF4444" />
      <!-- Seeds -->
      <ellipse cx="42" cy="54" rx="2" ry="3.5" fill="#1F2937" />
      <ellipse cx="58" cy="54" rx="2" ry="3.5" fill="#1F2937" />
      <ellipse cx="50" cy="44" rx="2" ry="3.5" fill="#1F2937" />
    </g>

    <!-- Fresh Strawberry on the other edge -->
    <g transform="translate(330, 115) rotate(20)">
      <path d="M 30 10 C 52 10 58 40 40 55 C 32 62 28 62 20 55 C 2 40 8 10 30 10 Z" 
            fill="#E11D48" stroke="#881337" stroke-width="5" stroke-linejoin="round" />
      <!-- Strawberry Cap/Leaves -->
      <path d="M 16 12 L 24 16 L 30 8 L 36 16 L 44 12 L 38 20 L 22 20 Z" fill="#22C55E" stroke="#14532D" stroke-width="3" />
      <!-- Yellow seed dots -->
      <circle cx="24" cy="28" r="2" fill="#FEF08A" />
      <circle cx="36" cy="28" r="2" fill="#FEF08A" />
      <circle cx="30" cy="38" r="2" fill="#FEF08A" />
      <circle cx="22" cy="44" r="1.5" fill="#FEF08A" />
      <circle cx="38" cy="44" r="1.5" fill="#FEF08A" />
    </g>
  </g>

  <!-- Cheerful Sparkles around the Smoothie Cup -->
  <!-- Top Left Sparkle -->
  <path d="M 80 90 Q 95 90 95 75 Q 95 90 110 90 Q 95 90 95 105 Q 95 90 80 90 Z" fill="#FEF08A" />
  <!-- Bottom Right Sparkle -->
  <path d="M 400 380 Q 415 380 415 365 Q 415 380 430 380 Q 415 380 415 395 Q 415 380 400 380 Z" fill="#FEF08A" />
  <!-- Small Star Sparkle -->
  <circle cx="430" cy="210" r="8" fill="#FFFFFF" opacity="0.9" />
  <circle cx="95" cy="260" r="7" fill="#FFFFFF" opacity="0.8" />
</svg>
